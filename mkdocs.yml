site_name: AUS-LAB | 自主无人系统与控制实验室
site_url: https://aus-lab.com
site_description: 状态估计、智能决策、多目标物集群、自动驾驶仿真、飞行器控制、芯片研制
site_author: 吕志超

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight

plugins:
  - search

# LaTeX数学公式支持
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - admonition

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - 首页: index.md
  - 王启明:
      - 个人简介: wqm.md
      - 主要研究内容: wqmcontent.md
  - 吕志超:
      - 个人简介: lzc.md
      - 主要研究方向-状态估计: lzccontent1.md
      - 主要研究方向-最优化方法: lzccontent2.md
      - 主要研究方向-控制理论: lzccontent3.md
      - 主要研究方向-航天器飞控与制导: lzccontent4.md
  - 王泽铭:
      - 个人简介: wzm.md
      - 主要研究内容: wzmcontent.md
  - 薛雨衫:
      - 个人简介: xys.md
      - 主要研究内容: xyscontent.md
  - 其他:
      - 总结: summary.md
      - 备忘: memo.md
